media:
  input: images
  output: /mybio/images

content:
  - name: posts
    label: Bài viết
    type: collection
    path: _posts
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date, published]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Tiêu đề
        type: string
        required: true
      - name: date
        label: Ngày đăng
        type: date
        options:
          time: true
          format: yyyy-MM-dd HH:mm:ss Z
      - name: excerpt
        label: Tóm tắt
        type: text
        required: true
      - name: tags
        label: Thẻ
        type: string
        list: true
      - name: cover
        label: Ảnh bìa
        type: image
        required: false
      - name: published
        label: Đăng công khai
        type: boolean
        default: false
      - name: body
        label: Nội dung
        type: rich-text
        required: true


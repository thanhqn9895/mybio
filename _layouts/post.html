---
layout: default
---
<div class="back-row"><a class="back-link" href="{{ '/blog/' | relative_url }}">← Quay lại Blog</a></div>
<article class="post-full">
  <div class="post-date">{{ page.date | date: '%d/%m/%Y' }}</div>
  <h1 class="post-full-title">{{ page.title }}</h1>
  {% if page.tags %}<div class="post-tags">{% for tag in page.tags %}<span>{{ tag }}</span>{% endfor %}</div>{% endif %}
  {% if page.cover %}<img class="cover" src="{{ page.cover | relative_url }}" alt="Ảnh bìa {{ page.title }}">{% endif %}
  <div class="post-body">{{ content }}</div>
</article>
